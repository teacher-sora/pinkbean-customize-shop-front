# main 에 개발 전용 경로(/viewer 화면 · public/dev 실험 데이터)가 섞였는지 막는 마지막 그물.
# 로컬 훅(.githooks)을 쓰지 않는 환경·다른 기기에서도 동작한다.
name: dev 전용 경로 차단

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 개발 전용 경로가 없는지 확인
        run: |
          for p in src/app/viewer public/dev; do
            if [ -e "$p" ]; then
              echo "::error::개발 전용 경로 $p 가 main 에 있습니다. dev 에서만 유지해야 합니다."
              exit 1
            fi
          done
          echo "확인: src/app/viewer · public/dev 없음"
